server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Hosted multi-document analysis is synchronous and can legitimately take
    # longer than nginx's 60-second default. Keep the browser request attached
    # so a completed durable run is not mistaken for a failed request and
    # accidentally submitted again.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /health {
    proxy_pass http://backend:8000/health;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
