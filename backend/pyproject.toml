[project]
name = "project-evidence-agent"
version = "0.1.0"
description = "Grounded project-delivery document analysis backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "greenlet>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "openai>=2.8,<3",
  "mcp>=2,<3",
  "pgvector>=0.3,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "reportlab>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_evidence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_llm: opt-in test that calls the configured hosted LLM"]
